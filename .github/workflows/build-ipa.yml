name: Build 3105 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Show project
        run: |
          ls -la
          find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          mkdir -p output
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "APP not found"
            exit 1
          fi

          cp -R "$APP_PATH" output/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: 3105-iOS-Build
          path: output/
