name: Build HTVANTIX iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="3105_HOME_UI_PHASE1_HOME.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          ROOT="$(find extracted -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit | xargs dirname)"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/ThreeOneOSFive.xcodeproj" ]; then
            echo "ERROR: project root not found"
            exit 1
          fi

          if [ -d overlay ]; then
            echo "Applying overlay files..."
            cp -R overlay/. "$ROOT/"
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROJECT=$ROOT/ThreeOneOSFive.xcodeproj" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

          echo "===== SOURCE HASHES ====="
          find "$ROOT/ThreeOneOSFive" "$ROOT/ThreeOneOSFive.xcodeproj" \
            -type f \
            \( -name '*.swift' -o -name '*.m' -o -name '*.h' -o -name '*.c' -o -name '*.plist' -o -name '*.strings' -o -name 'project.pbxproj' -o -name '*.json' \) \
            -print0 | sort -z | xargs -0 shasum -a 256

      - name: Upload base source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-base-source-snapshot
          path: 3105_HOME_UI_PHASE1_HOME.zip
          if-no-files-found: error

      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -list

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find build -maxdepth 7 -print || true
            exit 1
          fi

          rm -rf Payload HTVANTIX-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry HTVANTIX-unsigned.ipa Payload
          ls -lh HTVANTIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-unsigned-IPA
          path: HTVANTIX-unsigned.ipa
          if-no-files-found: error
