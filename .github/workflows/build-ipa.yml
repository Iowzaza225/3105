name: Build RUIZENCLIENT Standard (Build 17)

on:
  workflow_dispatch:
  push:
    branches:
      - release/ruizenclient-standard-build17

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RUIZEN_CLIENT_BUILD10.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          ROOT="$(find extracted -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit | xargs dirname)"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/ThreeOneOSFive.xcodeproj" ]; then
            echo "ERROR: project root not found"
            exit 1
          fi

          if [ -d overlay ]; then
            echo "Applying overlay files..."
            cp -R overlay/. "$ROOT/"
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROJECT=$ROOT/ThreeOneOSFive.xcodeproj" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

          echo "===== SOURCE HASHES ====="
          find "$ROOT/ThreeOneOSFive" "$ROOT/ThreeOneOSFive.xcodeproj" \
            -type f \
            \( -name '*.swift' -o -name '*.m' -o -name '*.h' -o -name '*.c' -o -name '*.plist' -o -name '*.strings' -o -name 'project.pbxproj' -o -name '*.json' \) \
            -print0 | sort -z | xargs -0 shasum -a 256

      - name: Upload base source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RUIZENCLIENT-base-source-snapshot
          path: RUIZEN_CLIENT_BUILD10.zip
          if-no-files-found: error

      - name: Prepare RUIZEN app identity and icon
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_branding.py "$ROOT" branding/RuizenProfile.jpeg
          python3 ci/apply_catalog_status.py "$ROOT"
          python3 ci/fix_catalog_origin.py "$ROOT"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/helpers/PatchProjectLibrary.swift"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/views/PatchProjectsView.swift"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/helpers/PatchProjectStore.swift"
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          root = pathlib.Path(os.environ["ROOT"])
          p = root / "ThreeOneOSFive/Info.plist"
          info = plistlib.loads(p.read_bytes())
          info["CFBundleDisplayName"] = "RUIZENCLIENT"
          info["CFBundleName"] = "RUIZENCLIENT"
          info["CFBundleVersion"] = "17"
          p.write_bytes(plistlib.dumps(info))
          logo = root / "ThreeOneOSFive/Assets.xcassets/HTVLogo.imageset/HTVLogo.jpeg"
          icon = root / "ThreeOneOSFive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          subprocess.run(["sips", "-s", "format", "png", "-z", "1024", "1024", str(logo), "--out", str(icon)], check=True)
          assert icon.read_bytes().startswith(b"\x89PNG")
          assert not (root / "ThreeOneOSFive/native").exists(), "Unexpected native bridge in standard build"
          pbx = (root / "ThreeOneOSFive.xcodeproj/project.pbxproj").read_text()
          assert "airlift" not in pbx.lower(), "Unexpected AirLift linkage"
          assert "ContentView()" in (root / "ThreeOneOSFive/App.swift").read_text()
          print("Verified RUIZENCLIENT STANDARD build 17: no AirLift source or linkage")
          PY

      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -list

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            PRODUCT_NAME="RUIZENCLIENT" \
            CURRENT_PROJECT_VERSION=17 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find build -maxdepth 7 -print || true
            exit 1
          fi

          python3 - "$APP" <<'PY'
          import pathlib, plistlib, sys, subprocess
          app = pathlib.Path(sys.argv[1])
          p = app / "Info.plist"
          info = plistlib.loads(p.read_bytes())
          info["CFBundleDisplayName"] = "RUIZENCLIENT"
          info["CFBundleName"] = "RUIZENCLIENT"
          info["CFBundleVersion"] = "17"
          p.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_BINARY))
          for localized in app.glob("*.lproj/InfoPlist.strings"):
              subprocess.run(["plutil", "-convert", "xml1", str(localized)], check=True)
              values = plistlib.loads(localized.read_bytes())
              for key in ("CFBundleDisplayName", "CFBundleName"):
                  if key in values: values[key] = "RUIZENCLIENT"
              localized.write_bytes(plistlib.dumps(values, fmt=plistlib.FMT_BINARY))
          assert info["CFBundleIdentifier"] == "com.apple.mobile.MobileHouseArrest"
          assert (app / info["CFBundleExecutable"]).is_file()
          assert list(app.glob("AppIcon*.png")), "Compiled app icon missing"
          print("Verified packaged app:", info["CFBundleDisplayName"], info["CFBundleName"], info["CFBundleVersion"])
          PY

          rm -rf Payload RUIZENCLIENT-STANDARD-BUILD17-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RUIZENCLIENT-STANDARD-BUILD17-unsigned.ipa Payload
          python3 - <<'PY'
          import zipfile, plistlib
          with zipfile.ZipFile("RUIZENCLIENT-STANDARD-BUILD17-unsigned.ipa") as z:
              paths = z.namelist()
              app_info = next(p for p in paths if p.startswith("Payload/") and p.count("/")==2 and p.endswith("/Info.plist"))
              info = plistlib.loads(z.read(app_info))
              assert info["CFBundleName"] == "RUIZENCLIENT"
              assert info["CFBundleDisplayName"] == "RUIZENCLIENT"
              assert info["CFBundleVersion"] == "17"
              assert not any("airlift" in p.lower() for p in paths)
              print("Verified IPA: RUIZENCLIENT, build 17, standard edition")
          PY
          ls -lh RUIZENCLIENT-STANDARD-BUILD17-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RUIZENCLIENT-STANDARD-BUILD17-unsigned-IPA
          path: RUIZENCLIENT-STANDARD-BUILD17-unsigned.ipa
          if-no-files-found: error
